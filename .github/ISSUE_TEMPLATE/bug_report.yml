name: Bug report
description: A game draws wrong, runs slow, has sound problems, or BreadBox crashes
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [known issues](https://github.com/BreadChaser/BreadBox#known-issues) first.
        Don't attach game files, BIOS files or anything you don't own.
  - type: dropdown
    id: console
    attributes:
      label: Console
      options:
        - Old 3DS
        - Old 3DS XL
        - Old 2DS
        - New 3DS
        - New 3DS XL
        - New 2DS XL
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BreadBox version
      description: Shown on the Settings card in the room, for example 0.9.1.
      placeholder: 0.9.1
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - PlayStation
        - Game Boy Advance
        - Not about a game (room, Collection, Settings, updates)
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and region
      description: Add the PlayStation serial (like SCUS-94900) or the Game Boy Advance game code (like AMKE) if you know it.
      placeholder: Resident Evil 2, Spain (PAL)
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Picture (wrong, flickering, missing, garbage)
        - Speed (slow, stuttering)
        - Sound
        - Crash or freeze
        - Saves, postcards or memory card
        - Controls
        - 3D
        - Room, Collection or Settings
        - Updates or importing from PSX3D
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repeat
    attributes:
      label: Where in the game and which settings
      description: Where it happens, and any settings you changed (for example frameskip, widescreen, 3D, screen size or frame blend).
  - type: textarea
    id: photo
    attributes:
      label: Photo or screenshot
      description: A phone photo of the screen is fine. Drag it into this box.
  - type: textarea
    id: log
    attributes:
      label: log.txt (optional)
      description: |
        If you can, drag `sdmc:/3ds/BreadBox/log.txt` from your SD card into this box. It's from the last time you played,
        so copy it before you start BreadBox again. Older sessions are `log.1.txt` to `log.4.txt`.
